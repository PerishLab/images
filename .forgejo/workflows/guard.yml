name: guard

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: docker
    container:
      image: docker.io/library/docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    env:
      DOCKER_HOST: tcp://172.17.0.1:2375
      OCI_PREFIX: git.perish.top/perishfire/images
      REVISION: ${{ github.sha }}
      TAG: guard-${{ github.sha }}
    steps:
      - name: Checkout
        env:
          GIT_SSL_CAINFO: /etc/ssl/certs/ca-certificates.crt
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}.git
          REVISION: ${{ github.sha }}
        run: |
          set -eu
          apk add --no-cache git
          git init .
          git remote add origin "$REPOSITORY"
          git fetch --depth=1 origin "$REVISION"
          git checkout --detach FETCH_HEAD

      - name: Prove public inputs
        run: |
          set -eu
          if grep -n -E 'mirror[.]perish[.]lan|ghcr[.]io|PerishLab/actions|runner-control' Containerfile.* docker-bake.hcl; then
            exit 1
          fi

      - name: Build
        run: |
          set -eu
          docker buildx version
          docker buildx inspect --bootstrap
          docker buildx bake --print
          docker buildx bake --load

      - name: Prove Rust job
        run: |
          set -eu
          image="${OCI_PREFIX}/forge:${TAG}"
          docker run --rm "$image" sh -ec '
            test "$(rustc --version | cut -d " " -f 2)" = 1.97.0
            cargo --version
            rustfmt --version
            cargo clippy --version
            sccache --version
          '

      - name: Prove Node job
        run: |
          set -eu
          image="${OCI_PREFIX}/forge:${TAG}"
          docker run --rm "$image" sh -ec '
            test "$(node --version)" = v24.18.0
            npm --version
            corepack --version
          '

      - name: Prove mixed job
        run: |
          set -eu
          image="${OCI_PREFIX}/forge:${TAG}"
          docker run --rm "$image" sh -ec '
            printf "fn main(){print!(\"forge\");}" >/tmp/forge.rs
            rustc /tmp/forge.rs -o /tmp/forge
            test "$(node -e "process.stdout.write(require(\"node:child_process\").execFileSync(\"/tmp/forge\"))")" = forge
          '

      - name: Prove release job
        run: |
          set -eu
          image="${OCI_PREFIX}/forge:${TAG}"
          docker run --rm "$image" sh -ec '
            aws s3api put-object --generate-cli-skeleton input | jq -e '\''has("IfNoneMatch") and has("IfMatch")'\''
            git --version
            curl --version
          '

      # The image carries the Docker client and Helm, not a daemon and not a
      # cluster: a job that projects an image or a chart supplies its own
      # endpoint. Proving the clients run is therefore the whole claim, and
      # `docker --version` is asked without a daemon on purpose.
      - name: Prove projection clients
        run: |
          set -eu
          image="${OCI_PREFIX}/forge:${TAG}"
          docker run --rm "$image" sh -ec '
            docker --version
            helm version --short
            helm package --help >/dev/null
            helm push --help >/dev/null
          '
